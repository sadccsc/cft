[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sadc-cft"
version = "6.0.12"
description = "Climate Forecasting Tool package to support generation of seasonal forecast by SADC CSC and National Met Services"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors=[
{name="Piotr Wolski", email="wolski@csag.uct.ac.za"},
{name="Sunshine Gamedze",email="sgamedze@sadc.int"}
]
dependencies = [
    # scientific / data stack - used throughout functions_forecast.py
    "numpy",
    "pandas",
    "geopandas",
    "xarray",
    "dask",
    "rioxarray",
    "scipy",
    "shapely",
    "rasterio",
    "rasterstats",
    "scikit-learn",
    "statsmodels",
    "netCDF4",
    "cftime",
    "geojson",
    "descartes",
    "geocube",
    "GDAL",          # provides the 'osgeo' module (zoning.py's ogr usage)
    "requests",

    # plotting / mapping
    "matplotlib",
    "cartopy",

    # GUI
    "PyQt5",

    #CDS api
    "cdsapi",
]

[project.urls]
Homepage = "https://github.com/sadccsc/cft"

[project.scripts]
cft = "cft.__main__:main"
forecast-tool = "cft.forecast:main"
download-tool = "cft.download:main"
synthesis-tool = "cft.synthesis:main"
verification-tool = "cft.verification:main"
zoning-tool = "cft.zoning:main"

[project.optional-dependencies]
cds = ["cdsapi"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[tool.hatch.build.targets.wheel]
packages = ["src/cft"]


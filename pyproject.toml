[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sadc-cft"
version = "7.1.3"
description = "Climate Forecasting Tool package to support generation of seasonal forecast by SADC CSC and National Met Services"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors=[
{name="Piotr Wolski", email="wolski@csag.uct.ac.za"},
{name="Sunshine Gamedze",email="sgamedze@sadc.int"}
]
dependencies = [
    # scientific / data stack - used throughout functions_forecast.py
    "numpy",
    "pandas",
    "geopandas",
    "xarray",
    "dask",
    "rioxarray",
    "scipy",
    "shapely",
    "rasterio",
    "rasterstats",
    "scikit-learn",
    "statsmodels",
    "netCDF4",
    "cftime",
    "geojson",
    "descartes",
    "geocube",
    "requests",

    # plotting / mapping
    "matplotlib",
    "cartopy",

    # GUI
    "PyQt5",

    #CDS api
    "cdsapi>=0.7.7",
]

[project.urls]
Homepage = "https://github.com/sadccsc/cft"
Documentation = "https://sadc-cft.readthedocs.io"

[project.scripts]
cft = "cft.__main__:main"
forecast-tool = "cft.forecast:main"
download-tool = "cft.download:main"
synthesis-tool = "cft.synthesis:main"
verification-tool = "cft.verification:main"
zoning-tool = "cft.zoning:main"
products_obs-tool = "cft.products_obs:main"


[project.optional-dependencies]
# GDAL provides the 'osgeo' module, used only by the zoning module (ogr).
# Install the GDAL library from conda-forge first, then: pip install "sadc-cft[zoning]"
zoning = ["GDAL"]
docs = ["sphinx", "sphinx-rtd-theme", "myst-parser"]

[tool.hatch.build.targets.wheel]
packages = ["src/cft"]


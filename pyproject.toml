[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sadc-cft"
version = "6.0.2"
description = "Climate Forecasting Tool package to support generation of seasonal forecast by SADC CSC and National Met Services"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors=[
{name="Piotr Wolski", email="wolski@csag.uct.ac.za"},
{name="Sunshine Gamedze",email="sgamedze@sadc.int"}
]
dependencies = [
    # scientific / data stack - used throughout functions_forecast.py
    "numpy",
    "pandas",
    "geopandas",
    "xarray",
    "rioxarray",
    "scipy",
    "shapely",
    "rasterio",
    "rasterstats",
    "scikit-learn",
    "statsmodels",
    "netCDF4",
    "cftime",
    "geojson",
    "descartes",
    "geocube",
    "GDAL",          # provides the 'osgeo' module (zoning.py's ogr usage)
    "requests",

    # plotting / mapping
    "matplotlib",
    "cartopy",

    # GUI
    "PyQt5",

    #CDS api
    "cdsapi",
]

[project.optional-dependencies]
 

[project.urls]
Homepage = "https://github.com/sadccsc/cft"

[project.scripts]
cft = "cft.__main__:main"
forecast-tool = "cft.forecast:main"
download-tool = "cft.download:main"
synthesis-tool = "cft.synthesis:main"
verification-tool = "cft.verification:main"
zoning-tool = "cft.zoning:main"


# [project.scripts] or [project.gui-scripts] 
# the firs will show terminal window alongside each app on Windows. 
# No difference on Mac/Linux.

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# adjust these globs once you know the real folder layout -
# e.g. if functions_forecast.py's "dictionaries" folder actually lives
# under cft/ rather than cft/functions/, move the entry accordingly
cft = ["*.ui", "dictionaries/*.json", "*.ico"]
